# Local dev without installing Ruby on the host.
# With modern Ruby you can also just run: bundle install && bundle exec jekyll serve
services:
  jekyll:
    image: ruby:3.4
    working_dir: /srv/jekyll
    volumes:
      - .:/srv/jekyll
      - bundle-cache:/usr/local/bundle
    ports:
      - "4000:4000"
    command: bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --force_polling --drafts"

volumes:
  bundle-cache:
