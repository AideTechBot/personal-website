# Site Info
title:              "Manuel Dionne"
blog_title:         "Blog"
projects_title:     "Projects"
description:        "Code, Space and Video Games"
author_name:        "Manuel Dionne"
logo_url:           https://raw.githubusercontent.com/AideTechBot/personal-website/master/assets/profile.png # Get it from GitHub API: https://api.github.com/users/<username>

# Site Settings
url:                https://mdionne.me # main url
baseurl:            
permalink:          /:title # Post permalink
timezone:           America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
mathjax:            true  # enables support for mathjax - set to 'false' to disable

# Site Build
highlighter:        rouge
markdown:           kramdown
kramdown:
    input:          GFM
sass:
    style:          :compressed
    sourcemap:      never

# Other Params
include:            [ "robots.txt", "resume.html", "resume.css" ]
exclude:            [ "LICENSE", "README.md", "CNAME", "vendor", "Gemfile", "Gemfile.lock", "script", ".git", "docker-compose.yml" ]
plugins:
  - jekyll-sitemap

collections:
  projects:
    output: true

defaults:
  -
    scope:
      path:         ""
    values:
      layout:       "null"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:         "posts"
    values:
      layout:       "post"
  -
    scope:
      type: "projects" 
    values:
      layout: "page"
